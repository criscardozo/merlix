name: Merlix
options:
  bundleIdPrefix: dev.cardozo
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:
  Merlix:
    type: application
    platform: macOS
    sources:
      - path: apps/macos
      # Ghostty's runtime resources: themes and shell integration, plus the
      # terminfo entry libghostty uses to locate them inside the bundle.
      - path: .build/ghostty/share/ghostty
        type: folder
        buildPhase: resources
      - path: .build/ghostty/share/terminfo
        type: folder
        buildPhase: resources
    dependencies:
      - framework: .build/ghostty/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: IOSurface.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: UserNotifications.framework
      - sdk: libc++.tbd
    info:
      path: apps/macos/Info.plist
      properties:
        CFBundleDisplayName: Merlix
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
        # What sidebar rows and tabs carry while dragged; see UTType.merlixItem.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.cardozo.merlix.item
            UTTypeDescription: Merlix item
            UTTypeConformsTo: [public.data]
    settings:
      base:
        PRODUCT_NAME: Merlix
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.merlix
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        # Signed with the personal team so macOS keeps its permissions (App
        # Management, notifications) across rebuilds; an ad hoc signature changes
        # every build. A terminal must spawn arbitrary shells, so no sandbox.
        DEVELOPMENT_TEAM: FA737M2U79
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Manual
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
